<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Chah - Secure Enterprise Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* كۆرۈنۈش ئۇسلۇبلىرى ئوخشاش، پەقەت سىستېما يادروسى ئۆزگەردى */
        :root {
            --bg: #05070e;
            --surface: rgba(14, 20, 36, 0.88);
            --border: rgba(0, 242, 254, 0.22);
            --neon-blue: #00f2fe;
            --neon-purple: #9d00ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --gold: #ffbe0b;
            --text-main: #f0f4fc;
            --text-muted: #798ba3;
            --radius-md: 12px;
            --transition: all 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 90px; }
        .font-tech { font-family: 'Orbitron', sans-serif; }

        .header {
            position: sticky; top: 0; z-index: 200; background: rgba(5, 7, 14, 0.95);
            backdrop-filter: blur(18px); border-bottom: 1px solid var(--border);
            padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
        }

        .brand { font-size: 1.35rem; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .glass-btn {
            background: var(--surface); border: 1px solid var(--border); color: #fff;
            padding: 7px 12px; border-radius: 20px; font-weight: 600; cursor: pointer;
        }
        .glass-btn:hover { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }

        .app-container { max-width: 900px; margin: 15px auto; padding: 0 15px; }
        .glass-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 15px; }
        
        .panel-heading { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; color: #fff; }
        .panel-heading i { color: var(--neon-blue); margin-left: 6px; }

        .game-scroller, .tiers-grid { display: grid; gap: 10px; }
        .game-scroller { grid-template-columns: repeat(4, 1fr); }
        .tiers-grid { grid-template-columns: repeat(3, 1fr); }

        .game-box, .tier-box {
            background: rgba(10, 14, 26, 0.8); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 6px; text-align: center; cursor: pointer;
        }
        .game-box.active { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0, 242, 254, 0.1); }
        .tier-box.active { border-color: var(--neon-pink); background: rgba(255, 0, 127, 0.08); }

        input, select {
            width: 100%; background: rgba(5, 8, 16, 0.9); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px; color: #fff; margin-top: 6px; outline: none;
        }

        .checkout-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 7, 14, 0.95);
            border-top: 1px solid var(--border); padding: 14px 20px; z-index: 150;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-glow {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none; color: #fff; padding: 12px 30px; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; padding: 15px;}
        .modal.active { display: flex; }
        .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; }

        .loading-spinner { display: none; color: var(--neon-green); font-size: 0.85rem; margin-top: 5px; }
        .loading-spinner.active { display: block; }
    </style>
</head>
<body>

<header class="header">
    <div class="brand font-tech">AUTO CHAH</div>
    <div style="display:flex; gap:10px; align-items:center;">
        <span id="userBalance" style="color:var(--gold); font-weight:bold;">$0.00</span>
        <button class="glass-btn" onclick="toggleAuthModal()" id="authBtn">كىرىش</button>
    </div>
</header>

<div class="app-container">
    <div class="glass-panel">
        <div class="panel-heading"><i class="fa-solid fa-layer-group"></i> ئويۇن تاللاڭ</div>
        <div class="game-scroller" id="gameGrid"></div>
    </div>

    <div class="glass-panel">
        <div class="panel-heading"><i class="fa-solid fa-user-astronaut"></i> ھېسابات ئۇچۇرى</div>
        <input type="number" id="inputUID" placeholder="UID نومۇرىنى يېزىڭ...">
    </div>

    <div class="glass-panel">
        <div class="panel-heading"><i class="fa-solid fa-bolt-lightning"></i> بولاق تاللاڭ</div>
        <div class="tiers-grid" id="tierGrid"></div>
    </div>
    
    <div class="glass-panel">
        <div class="panel-heading"><i class="fa-solid fa-credit-card"></i> چىقىم شەكلى</div>
        <div class="game-box active"><i class="fa-solid fa-wallet"></i> ھېسابات قالدۇقى ($ USD)</div>
    </div>
</div>

<div class="checkout-bar">
    <div>
        <div style="font-size:0.75rem; color:var(--text-muted);">چىقىم</div>
        <div id="finalPriceDisplay" style="color:var(--gold); font-size:1.3rem; font-weight:bold;">$0.00</div>
    </div>
    <button class="btn-glow" onclick="submitSecureOrder()">سېتىۋېلىش</button>
</div>

<!-- Auth Modal -->
<div class="modal" id="authModal">
    <div class="modal-box">
        <h3 style="text-align:center; color:var(--neon-blue); margin-bottom:15px;" id="authTitle">ھېساباتقا كىرىش</h3>
        <input type="text" id="authUsername" placeholder="ئىشلەتكۈچى نامى">
        <input type="email" id="authEmail" placeholder="ئېلخەت ئادرېسى" style="display:none;">
        <input type="password" id="authPassword" placeholder="مەخپىي نومۇر">
        
        <div id="authLoading" class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> مۇلازىمېتىرغا ئۇلىنىۋاتىدۇ...</div>
        
        <button class="btn-glow" style="width:100%; margin-top:15px;" onclick="processAuth()" id="authSubmitBtn">كىرىش</button>
        <div style="text-align:center; margin-top:10px; font-size:0.85rem; color:var(--text-muted); cursor:pointer;" onclick="switchAuthMode()">يېڭى ھېسابات قۇرۇشمۇ؟</div>
    </div>
</div>

<script>
    // مۇلازىمېتىر ئادرېسى (Pydroid 3 دىكى Python مۇلازىمېتىرىغا ئۇلىنىدۇ)
    const API_BASE = "http://127.0.0.1:5000/api";
    
    let isLoginMode = true;
    let currentUser = JSON.parse(localStorage.getItem('secure_user_session')) || null;
    let selectedTier = null;
    let activeGame = 'PUBG Mobile';

    const DEMO_GAMES = [
        { id: 'pubg', title: 'PUBG Mobile', icon: 'fa-crosshairs', tiers: [{name: '60 UC', price: 0.99}, {name: '325 UC', price: 4.99}] },
        { id: 'mlbb', title: 'Mobile Legends', icon: 'fa-shield-halved', tiers: [{name: '86 Dia', price: 1.49}, {name: '257 Dia', price: 4.49}] }
    ];

    window.onload = () => {
        updateUI();
        renderGames();
    };

    function updateUI() {
        if(currentUser) {
            document.getElementById('authBtn').innerText = 'چىقىش';
            document.getElementById('userBalance').innerText = `$${currentUser.balance.toFixed(2)}`;
        } else {
            document.getElementById('authBtn').innerText = 'كىرىش';
            document.getElementById('userBalance').innerText = `$0.00`;
        }
    }

    function renderGames() {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = DEMO_GAMES.map(g => `<div class="game-box ${g.title===activeGame?'active':''}" onclick="selectGame('${g.title}')"><i class="fa-solid ${g.icon}"></i> <span>${g.title}</span></div>`).join('');
        renderTiers();
    }

    function selectGame(name) {
        activeGame = name;
        renderGames();
    }

    function renderTiers() {
        const game = DEMO_GAMES.find(g => g.title === activeGame);
        selectedTier = game.tiers[0];
        document.getElementById('finalPriceDisplay').innerText = `$${selectedTier.price.toFixed(2)}`;
        
        const grid = document.getElementById('tierGrid');
        grid.innerHTML = game.tiers.map((t, i) => `<div class="tier-box ${i===0?'active':''}" onclick="selectTier(this, ${t.price}, '${t.name}')"><strong>${t.name}</strong><br><span style="color:var(--gold);">$${t.price}</span></div>`).join('');
    }

    function selectTier(el, price, name) {
        document.querySelectorAll('.tier-box').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        selectedTier = {name, price};
        document.getElementById('finalPriceDisplay').innerText = `$${price.toFixed(2)}`;
    }

    function toggleAuthModal() {
        if(currentUser) {
            if(confirm('ھېساباتتىن چىقامسىز؟')) {
                currentUser = null;
                localStorage.removeItem('secure_user_session');
                updateUI();
            }
            return;
        }
        document.getElementById('authModal').classList.toggle('active');
    }

    function switchAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? 'ھېساباتقا كىرىش' : 'يېڭى ھېسابات قۇرۇش';
        document.getElementById('authSubmitBtn').innerText = isLoginMode ? 'كىرىش' : 'تىزىملىتىش';
        document.getElementById('authEmail').style.display = isLoginMode ? 'none' : 'block';
    }

    // ===============================================
    // Python مۇلازىمېتىرى بىلەن ئالاقە قىلىش (API FETCH)
    // ===============================================
    async function processAuth() {
        const username = document.getElementById('authUsername').value;
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const loader = document.getElementById('authLoading');
        
        if(!username || !password) return alert('ئۇچۇرنى تولۇق يېزىڭ!');
        
        loader.classList.add('active');
        const endpoint = isLoginMode ? '/login' : '/register';
        const payload = isLoginMode ? {username, password} : {username, email, password};

        try {
            const res = await fetch(API_BASE + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if(data.success) {
                if(!isLoginMode) {
                    alert('تىزىملىتىش مۇۋەپپەقىيەتلىك! ئەمدى كىرىڭ.');
                    switchAuthMode();
                } else {
                    currentUser = data.user;
                    localStorage.setItem('secure_user_session', JSON.stringify(currentUser));
                    updateUI();
                    toggleAuthModal();
                    alert(data.msg);
                }
            } else {
                alert(data.msg);
            }
        } catch (error) {
            alert('مۇلازىمېتىرغا ئۇلىنالمىدى! Python كودىنىڭ ئىجرا قىلىنىۋاتقانلىقىنى تەكشۈرۈڭ.');
        } finally {
            loader.classList.remove('active');
        }
    }

    async function submitSecureOrder() {
        if(!currentUser) return alert('ئالدى بىلەن كىرىڭ!');
        
        const uid = document.getElementById('inputUID').value;
        if(!uid) return alert('UID كىرگۈزۈڭ!');

        document.getElementById('authLoading').classList.add('active'); // Loading

        try {
            const res = await fetch(API_BASE + '/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: currentUser.id,
                    game: activeGame,
                    package: selectedTier.name,
                    target_uid: uid,
                    cost: selectedTier.price,
                    payment_method: 'Wallet'
                })
            });
            const data = await res.json();
            
            if(data.success) {
                // مۇلازىمېتىر قايتۇرغان يېڭى قالدۇق پۇلنى يېڭىلاش
                currentUser.balance = data.new_balance;
                localStorage.setItem('secure_user_session', JSON.stringify(currentUser));
                updateUI();
                alert('زاكاز مۇۋەپپەقىيەتلىك بېجىرىلدى! مۇلازىمېتىر تەرىپىدىن پۇل تۇتۇلدى.');
            } else {
                alert(data.msg);
            }
        } catch (err) {
            alert('زاكاز سىستېمىسىغا ئۇلىنالمىدى!');
        }
    }
</script>

</body>
</html>
