<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Chah - شحن الرصيد والخدمات الرقمية</title>
    <!-- Tailwind CSS ئارقىلىق لايىھەلەندى -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0b0f19',
                        cardDark: '#131826',
                        accentBlue: '#3b82f6',
                        accentGlow: '#60a5fa'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .glow-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body class="bg-brandDark min-h-screen pb-20">

    <!-- ئۈستۈنكى قىسىم (Header) -->
    <header class="bg-cardDark border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-xl text-white font-bold text-lg">⚡ Auto Chah</div>
        </div>
        <div class="flex items-center gap-2 bg-gray-900 border border-gray-700 px-3 py-1.5 rounded-full">
            <span class="text-xs text-gray-400">الرصيد:</span>
            <span class="font-bold text-green-400">0.00 $</span>
        </div>
    </header>

    <!-- ئاساسلىق مەزمۇن -->
    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- قارشى ئېلىش ۋە تەشۋىقات كارتىسى -->
        <div class="glow-card border border-blue-500/30 rounded-2xl p-5 text-center space-y-3">
            <h1 class="text-xl font-extrabold text-white">مرحباً بك في Auto Chah</h1>
            <p class="text-xs text-gray-300">أسرع وأضمن منصة لشحن الألعاب والخدمات الرقمية وتعبئة الرصيد الفوري.</p>
            <button class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200">
                اشحن رصيدك الآن ⚡
            </button>
        </div>

        <!-- ئويۇن ۋە مۇلازىمەت تۈرلىرى (Grid) -->
        <section>
            <h2 class="text-sm font-semibold text-gray-400 mb-3">اختر خدمة الشحن</h2>
            <div class="grid grid-cols-3 gap-3">
                
                <!-- 1 -->
                <div class="bg-cardDark border border-gray-800 p-3 rounded-2xl text-center space-y-2 hover:border-blue-500 transition cursor-pointer">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl mx-auto flex items-center justify-center text-xl">🎮</div>
                    <span class="text-xs font-medium block">PUBG Mobile</span>
                </div>

                <!-- 2 -->
                <div class="bg-cardDark border border-gray-800 p-3 rounded-2xl text-center space-y-2 hover:border-blue-500 transition cursor-pointer">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl mx-auto flex items-center justify-center text-xl">⚔️</div>
                    <span class="text-xs font-medium block">Mobile Legends</span>
                </div>

                <!-- 3 -->
                <div class="bg-cardDark border border-gray-800 p-3 rounded-2xl text-center space-y-2 hover:border-blue-500 transition cursor-pointer">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl mx-auto flex items-center justify-center text-xl">👑</div>
                    <span class="text-xs font-medium block">Honor of Kings</span>
                </div>

                <!-- 4 -->
                <div class="bg-cardDark border border-gray-800 p-3 rounded-2xl text-center space-y-2 hover:border-blue-500 transition cursor-pointer">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl mx-auto flex items-center justify-center text-xl">🎯</div>
                    <span class="text-xs font-medium block">Arena Breakout</span>
                </div>

                <!-- 5 -->
                <div class="bg-cardDark border border-gray-800 p-3 rounded-2xl text-center space-y-2 hover:border-blue-500 transition cursor-pointer">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl mx-auto flex items-center justify-center text-xl">📱</div>
                    <span class="text-xs font-medium block">تعبئة رصيد</span>
                </div>

                <!-- 6 -->
                <div class="bg-cardDark border border-gray-800 p-3 rounded-2xl text-center space-y-2 hover:border-blue-500 transition cursor-pointer">
                    <div class="w-12 h-12 bg-blue-500/10 rounded-xl mx-auto flex items-center justify-center text-xl">💬</div>
                    <span class="text-xs font-medium block">خدمات تيليجرام</span>
                </div>

            </div>
        </section>

        <!-- ئويۇن ID كىرگۈزۈش بۆلۈمى -->
        <section class="bg-cardDark border border-gray-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold text-gray-300">أدخل معرّف اللاعب (Player ID)</h3>
            <div class="flex gap-2">
                <input type="text" placeholder="أدخل آيدي اللاعب هنا..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                <button class="bg-blue-600 px-4 rounded-xl text-sm font-bold">تحقق</button>
            </div>
        </section>

    </main>

    <!-- تۆۋەندىكى تىزىملىك (Bottom Navigation) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-cardDark border-t border-gray-800 py-2 px-6 flex justify-between items-center text-xs text-gray-400">
        <button class="flex flex-col items-center text-blue-500">
            <span>🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span>📋</span>
            <span>طلباتي</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span>💳</span>
            <span>الشحن</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span>👤</span>
            <span>حسابي</span>
        </button>
    </nav>

</body>
</html>
